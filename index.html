<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softphone SDK Demo (Headless & Default UI)</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            background: #f6f7f9; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 40px 20px; 
            margin: 0;
            color: #172033;
        }
        .controls-header {
            margin-bottom: 24px;
            text-align: center;
        }
        .btn-toggle {
            background: #172033;
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(23, 32, 51, 0.15);
        }
        .phone-ui { 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 12px 32px rgba(23, 32, 51, 0.08); 
            padding: 24px; 
            width: 100%;
            max-width: 480px; 
            border: 1px solid #dfe3e8;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        #softphone-default-container {
            width: 360px; 
            height: 560px; 
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(23, 32, 51, 0.08); 
            overflow: hidden;
            display: none;
        }
        .status { 
            text-align: center; 
            font-size: 14px; 
            color: #5f6b7a; 
            font-weight: 600; 
        }
        .input-group { 
            display: flex; 
            gap: 8px; 
        }
        input { 
            flex: 1;
            padding: 10px; 
            border: 1px solid #dfe3e8; 
            border-radius: 8px; 
            font-size: 15px; 
            outline: none;
        }
        input:focus { border-color: #3157d5; }
        
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .button-grid.three-cols {
            grid-template-columns: 1fr 1fr 1fr;
        }
        
        .btn { 
            padding: 10px; 
            border: 1px solid #dfe3e8; 
            border-radius: 8px; 
            font-size: 14px; 
            cursor: pointer; 
            background: #f2f4f7;
            font-weight: 600; 
            color: #172033;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-call { background: #3157d5; color: #ffffff; border-color: #3157d5; }
        .btn-answer { background: #28a745; color: #ffffff; border-color: #28a745; }
        .btn-hangup { background: #dc3545; color: #ffffff; border-color: #dc3545; }
        
        .logs-wrapper {
            border: 1px solid #dfe3e8;
            border-radius: 8px;
            overflow: hidden;
        }
        .logs-header {
            background: #f2f4f7;
            padding: 6px 12px;
            font-size: 12px;
            color: #5f6b7a;
            font-weight: 600;
            border-bottom: 1px solid #dfe3e8;
        }
        .logs { 
            background: #172033; 
            color: #4ade80; 
            font-family: monospace; 
            font-size: 12px; 
            padding: 12px; 
            height: 200px; 
            overflow-y: auto; 
            margin: 0;
        }
        .log-entry { margin-bottom: 6px; line-height: 1.4; word-wrap: break-word; }
        .log-time { color: #5f6b7a; margin-right: 4px; }
        .log-error { color: #f87171; }
        .section-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #5f6b7a; border-bottom: 1px solid #dfe3e8; padding-bottom: 4px; }
    </style>
</head>
<body>

    <div class="controls-header">
        <button id="toggle-mode-btn" class="btn-toggle">Переключить на Встроенный UI (ui.default)</button>
    </div>

    <!-- Встроенный UI -->
    <div id="softphone-default-container"></div>

    <!-- Headless UI -->
    <div id="headless-ui-container" class="phone-ui">
        <div class="status" id="status-display">Ожидание инициализации...</div>

        <div>
            <div class="section-title">Основное управление</div>
            <div class="input-group" style="margin-bottom: 10px;">
                <input type="text" id="phone-number" placeholder="Номер телефона (+7999...)" />
            </div>
            <div class="button-grid three-cols">
                <button class="btn btn-call" id="btn-call">Позвонить</button>
                <button class="btn btn-answer" id="btn-answer">Ответить</button>
                <button class="btn btn-hangup" id="btn-hangup">Завершить</button>
            </div>
        </div>

        <div>
            <div class="section-title">Аудио и Удержание (capabilities: hold, mute)</div>
            <div class="button-grid">
                <button class="btn" id="btn-mute">Выключить микрофон</button>
                <button class="btn" id="btn-unmute">Включить микрофон</button>
                <button class="btn" id="btn-hold">Поставить на удержание</button>
                <button class="btn" id="btn-unhold">Снять с удержания</button>
            </div>
        </div>

        <div>
            <div class="section-title">DTMF и Перевод (capabilities: dialpad, transfer)</div>
            <div class="input-group" style="margin-bottom: 10px;">
                <input type="text" id="dtmf-input" placeholder="Символ DTMF (напр. 1)" maxlength="1" style="flex: 0.3;" />
                <button class="btn" id="btn-dtmf" style="flex: 0.7;">Отправить DTMF</button>
            </div>
            <div class="button-grid">
                <button class="btn" id="btn-transfer">Слепой перевод (на номер из поля выше)</button>
            </div>
        </div>

        <div class="logs-wrapper">
            <div class="logs-header">События SDK</div>
            <div class="logs" id="logs-container"></div>
        </div>
    </div>

    <!-- Технический контейнер для runtime (headless режим) -->
    <div id="softphone-runtime" style="position: fixed; width: 1px; height: 1px; overflow: hidden"></div>

    <script src="https://dev-int0-softphone-widget-iframe.uis.st/embedder-sdk/embedder-sdk.umd.js"></script>

    <script>
        let client;
        let activeChannel;
        let currentMode = 'headless'; // 'headless' или 'default'

        const authConfig = {
            type: 'bearer',
            token: 'ac0z2uwgb1eed3c4gix4vmz5u86e2nht7c2acpye',
            expiresAt: Date.now() + 86400000 // +24 часа
        };
        const standaloneUrl = 'https://dev-int0-softphone-widget-iframe.uis.st/standalone/v1/index.html';

        // DOM элементы
        const toggleBtn = document.getElementById('toggle-mode-btn');
        const defaultContainer = document.getElementById('softphone-default-container');
        const headlessContainer = document.getElementById('headless-ui-container');
        const logsContainer = document.getElementById('logs-container');
        const statusDisplay = document.getElementById('status-display');
        const phoneInput = document.getElementById('phone-number');
        const dtmfInput = document.getElementById('dtmf-input');

        function log(message, isError = false) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${isError ? 'log-error' : ''}`;
            const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            logsContainer.appendChild(entry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        async function disconnectSdk() {
            if (client) {
                try {
                    if (client.grantedCapabilities && client.grantedCapabilities.includes('lifecycle.enabled')) {
                        await client.lifecycle.destroy();
                    }
                } catch (e) {
                    console.error('Ошибка при destroy', e);
                } finally {
                    client.disconnect();
                    client = undefined;
                    activeChannel = undefined;
                    log('SDK отключен');
                }
            }
        }

        async function connectSdk() {
            await disconnectSdk();

            try {
                log(`Подключение в режиме ${currentMode}...`);
                
                const capabilities = currentMode === 'headless' 
                    ? [
                        'call.lifecycle', 
                        'ui.headless', 
                        'call.hold', 
                        'call.mute', 
                        'call.dialpad', 
                        'call.channel', 
                        'call.transfer.blind'
                      ]
                    : [
                        'call.lifecycle', 
                        'ui.default',
                        'call.hold',
                        'call.mute'
                      ];

                const mountTo = currentMode === 'headless' 
                    ? document.getElementById('softphone-runtime') 
                    : document.getElementById('softphone-default-container');

                client = await window.SoftphoneSdk.connect({
                    mountTo: mountTo,
                    standaloneUrl: standaloneUrl,
                    capabilities: capabilities,
                    auth: authConfig,
                    debug: true
                });

                log(`Успешно. Доступные capabilities: ${client.grantedCapabilities.join(', ')}`);
                if (currentMode === 'headless') {
                    statusDisplay.textContent = 'Готов к работе (Headless)';
                }

                // Подписка на все события
                client.onAny((topic, payload) => {
                    log(`Событие: ${topic} ` + (payload ? JSON.stringify(payload) : ''));
                    
                    // Обновление активного канала для headless команд
                    if (payload && payload.channel !== undefined) {
                        activeChannel = payload.channel;
                    }
                    
                    if (currentMode === 'headless') {
                        updateHeadlessStatus(topic, payload);
                    }
                });

            } catch (error) {
                log(`Ошибка подключения: ${error.message}`, true);
                if (currentMode === 'headless') statusDisplay.textContent = 'Ошибка подключения';
            }
        }

        function updateHeadlessStatus(topic, payload) {
            switch (topic) {
                case 'call.ringing':
                    statusDisplay.textContent = `Входящий вызов: ${payload.phoneNumber}`;
                    break;
                case 'call.outgoing.started':
                    statusDisplay.textContent = `Исходящий вызов...`;
                    break;
                case 'call.connected':
                    statusDisplay.textContent = `Разговор установлен (канал ${payload.channel})`;
                    break;
                case 'call.ended':
                case 'call.failed':
                    statusDisplay.textContent = 'Готов к работе';
                    activeChannel = undefined;
                    break;
                case 'call.held':
                    statusDisplay.textContent = 'На удержании';
                    break;
                case 'call.unheld':
                    statusDisplay.textContent = 'Разговор установлен';
                    break;
            }
        }

        // Переключение режимов
        toggleBtn.addEventListener('click', async () => {
            if (currentMode === 'headless') {
                currentMode = 'default';
                headlessContainer.style.display = 'none';
                defaultContainer.style.display = 'block';
                toggleBtn.textContent = 'Переключить на Headless UI (ui.headless)';
            } else {
                currentMode = 'headless';
                headlessContainer.style.display = 'flex';
                defaultContainer.style.display = 'none';
                toggleBtn.textContent = 'Переключить на Встроенный UI (ui.default)';
            }
            await connectSdk();
        });

        // Привязка Headless команд
        const execCmd = async (name, fn) => {
            if (!client || currentMode !== 'headless') return log('Недоступно в текущем режиме', true);
            try {
                log(`Команда: ${name}`);
                await fn();
            } catch (e) {
                log(`Ошибка команды ${name}: ${e.message}`, true);
            }
        };

        document.getElementById('btn-call').onclick = () => execCmd('place', () => client.call.place(phoneInput.value.trim()));
        document.getElementById('btn-answer').onclick = () => execCmd('answer', () => client.call.answer({ channel: activeChannel }));
        document.getElementById('btn-hangup').onclick = () => execCmd('terminate', () => client.call.terminate({ channel: activeChannel }));
        
        document.getElementById('btn-mute').onclick = () => execCmd('mute', () => client.call.mute({ channel: activeChannel }));
        document.getElementById('btn-unmute').onclick = () => execCmd('unmute', () => client.call.unmute({ channel: activeChannel }));
        document.getElementById('btn-hold').onclick = () => execCmd('hold', () => client.call.hold({ channel: activeChannel }));
        document.getElementById('btn-unhold').onclick = () => execCmd('unhold', () => client.call.unhold({ channel: activeChannel }));
        
        // SDK signature: dialTone(tone: string), transferBlind(targetPhone: string).
        // Do NOT pass an options object — standalone forwards args.tone to JsSIP sendDTMF(string).
        document.getElementById('btn-dtmf').onclick = () => {
            const tone = String(dtmfInput.value || '').trim();
            if (!tone) return log('Укажите DTMF-символ (0-9, A-D, #, *)', true);
            return execCmd(`dialTone("${tone}")`, () => client.call.dialTone(tone));
        };
        document.getElementById('btn-transfer').onclick = () => {
            const targetPhone = String(phoneInput.value || '').trim();
            if (!targetPhone) return log('Укажите номер для перевода', true);
            return execCmd(`transferBlind("${targetPhone}")`, () => client.call.transferBlind(targetPhone));
        };

        // Инициализация при загрузке
        window.addEventListener('load', connectSdk);
    </script>
</body>
</html>
