<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headless Softphone Demo</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            background: #f6f7f9; 
            display: flex; 
            justify-content: center; 
            padding: 50px 20px; 
            margin: 0;
        }
        .phone-ui { 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 12px 32px rgba(23, 32, 51, 0.08); 
            padding: 24px; 
            width: 100%;
            max-width: 340px; 
            border: 1px solid #dfe3e8;
        }
        h2 {
            margin: 0 0 16px;
            font-size: 20px;
            text-align: center;
            color: #172033;
        }
        .status { 
            text-align: center; 
            font-size: 14px; 
            color: #5f6b7a; 
            margin-bottom: 20px; 
            height: 20px; 
            font-weight: 600; 
        }
        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            margin-bottom: 20px; 
        }
        input { 
            padding: 12px; 
            border: 1px solid #dfe3e8; 
            border-radius: 8px; 
            font-size: 16px; 
            text-align: center; 
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3157d5;
        }
        .buttons { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 20px; 
        }
        .btn { 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            cursor: pointer; 
            color: #ffffff; 
            font-weight: 600; 
            transition: opacity 0.2s, transform 0.1s; 
        }
        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }
        .btn-call { 
            background: #3157d5; 
            grid-column: span 2; 
        }
        .btn-answer { 
            background: #28a745; 
        }
        .btn-hangup { 
            background: #dc3545; 
        }
        .logs-wrapper {
            border: 1px solid #dfe3e8;
            border-radius: 8px;
            overflow: hidden;
        }
        .logs-header {
            background: #f2f4f7;
            padding: 6px 12px;
            font-size: 12px;
            color: #5f6b7a;
            font-weight: 600;
            border-bottom: 1px solid #dfe3e8;
        }
        .logs { 
            background: #172033; 
            color: #4ade80; 
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; 
            font-size: 11px; 
            padding: 12px; 
            height: 160px; 
            overflow-y: auto; 
            margin: 0;
        }
        .log-entry { 
            margin-bottom: 6px; 
            line-height: 1.4;
        }
        .log-time {
            color: #5f6b7a;
            margin-right: 4px;
        }
        .log-error {
            color: #f87171;
        }
    </style>
</head>
<body>

    <!-- Технический контейнер для runtime (headless режим) -->
    <div id="softphone-runtime" style="position: fixed; width: 1px; height: 1px; overflow: hidden"></div>

    <div class="phone-ui">
        <h2>Custom Softphone</h2>
        <div class="status" id="status-display">Ожидание инициализации...</div>

        <div class="input-group">
            <input type="text" id="phone-number" placeholder="Номер (напр. +12025550123)" />
        </div>

        <div class="buttons">
            <button class="btn btn-call" id="btn-call" disabled>Позвонить</button>
            <button class="btn btn-answer" id="btn-answer" disabled>Ответить</button>
            <button class="btn btn-hangup" id="btn-hangup" disabled>Завершить</button>
        </div>

        <div class="logs-wrapper">
            <div class="logs-header">Event Logs</div>
            <div class="logs" id="logs-container"></div>
        </div>
    </div>

    <!-- ВНИМАНИЕ: Замените URL на реальный адрес UMD-скрипта SDK -->
     <script src="https://dev-int0-softphone-widget-iframe.uis.st/embedder-sdk/embedder-sdk.umd.js"></script>

    <script>
        let client;
        let activeChannel;

        const statusDisplay = document.getElementById('status-display');
        const phoneInput = document.getElementById('phone-number');
        const btnCall = document.getElementById('btn-call');
        const btnAnswer = document.getElementById('btn-answer');
        const btnHangup = document.getElementById('btn-hangup');
        const logsContainer = document.getElementById('logs-container');

        function log(message, isError = false) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${isError ? 'log-error' : ''}`;
            const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            logsContainer.appendChild(entry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        function updateUI(state, payload = '') {
            btnCall.disabled = true;
            btnAnswer.disabled = true;
            btnHangup.disabled = true;
            phoneInput.disabled = true;

            switch (state) {
                case 'idle':
                    statusDisplay.textContent = 'Готов к работе';
                    statusDisplay.style.color = '#5f6b7a';
                    btnCall.disabled = false;
                    phoneInput.disabled = false;
                    break;
                case 'ringing_incoming':
                    statusDisplay.textContent = `Входящий: ${payload}`;
                    statusDisplay.style.color = '#e9bb43';
                    btnAnswer.disabled = false;
                    btnHangup.disabled = false;
                    break;
                case 'ringing_outgoing':
                    statusDisplay.textContent = `Вызов: ${payload}...`;
                    statusDisplay.style.color = '#3157d5';
                    btnHangup.disabled = false;
                    break;
                case 'connected':
                    statusDisplay.textContent = 'Разговор установлен';
                    statusDisplay.style.color = '#28a745';
                    btnHangup.disabled = false;
                    break;
                case 'error':
                    statusDisplay.textContent = 'Ошибка вызова';
                    statusDisplay.style.color = '#dc3545';
                    btnCall.disabled = false;
                    phoneInput.disabled = false;
                    break;
            }
        }

        async function initHeadlessSoftphone() {
            try {
                log('Инициализация SDK...');

                if (typeof window.SoftphoneSdk === 'undefined') {
                    throw new Error('SoftphoneSdk не найден. Проверьте URL скрипта.');
                }

                // В реальном проекте токен получается через fetch от вашего backend
                const auth = {
                    type: 'bearer',
                    token: 'ac0z2uwgb1eed3c4gix4vmz5u86e2nht7c2acpye',
                    expiresAt: Date.now() + 3600000 
                };

                client = await window.SoftphoneSdk.connect({
                    mountTo: document.getElementById('softphone-runtime'),
                    capabilities: [
                        'call.lifecycle',
                        'ui.headless',
                        'call.hold',
                        'call.mute'
                    ],
                    auth: auth,
                    debug: true // включено для отладки
                });

                log('SDK подключен (ui.headless)');
                updateUI('idle');

                // Подписка на события жизненного цикла звонка
                client.on('call.ringing', event => {
                    activeChannel = event.channel;
                    log(`call.ringing: от ${event.phoneNumber}`);
                    updateUI('ringing_incoming', event.phoneNumber);
                });

                client.on('call.outgoing.started', event => {
                    activeChannel = event.channel;
                    log('call.outgoing.started');
                    updateUI('ringing_outgoing', phoneInput.value);
                });

                client.on('call.connected', event => {
                    activeChannel = event.channel;
                    log(`call.connected: канал ${event.channel}`);
                    updateUI('connected');
                });

                client.on('call.ended', event => {
                    activeChannel = undefined;
                    log(`call.ended (причина: ${event.reason})`);
                    updateUI('idle');
                });

                client.on('call.failed', event => {
                    activeChannel = undefined;
                    log(`call.failed: ${event.message}`, true);
                    updateUI('error');
                    setTimeout(() => updateUI('idle'), 3000);
                });

                client.on('audio.permission.denied', () => {
                    log('audio.permission.denied: Нет доступа к микрофону', true);
                });

            } catch (error) {
                log(`Ошибка подключения: ${error.message}`, true);
                statusDisplay.textContent = 'SDK не подключен';
                statusDisplay.style.color = '#dc3545';
            }
        }

        // Привязка методов SDK к кнопкам UI
        btnCall.addEventListener('click', async () => {
            const number = phoneInput.value.trim();
            if (!number) {
                log('Введите номер для вызова', true);
                return;
            }
            try {
                log(`place('${number}')`);
                await client.call.place(number);
            } catch (err) {
                log(`Ошибка place(): ${err.message}`, true);
            }
        });

        btnAnswer.addEventListener('click', async () => {
            try {
                log(`answer({ channel: ${activeChannel} })`);
                await client.call.answer({ channel: activeChannel });
            } catch (err) {
                log(`Ошибка answer(): ${err.message}`, true);
            }
        });

        btnHangup.addEventListener('click', async () => {
            try {
                log(`terminate({ channel: ${activeChannel} })`);
                await client.call.terminate({ channel: activeChannel });
            } catch (err) {
                log(`Ошибка terminate(): ${err.message}`, true);
            }
        });

        window.addEventListener('load', initHeadlessSoftphone);
    </script>
</body>
</html>
